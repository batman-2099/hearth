  <title id="title">Hearth fireplace and flame</title>
  <style>
    /* Hallmark · scope: logo · theme: existing Hearth brand · signature: fireplace and flame */
    /* Critique: a literal hearth replaces the generic house initial; no glow or decorative detail. */
    :root { --background: #151719; --ink: #F4F3EF; --accent: #18BCF2; --wordmark: "DejaVu Sans", sans-serif; }
    .background { fill: var(--background); }
    .frame, .wordmark { fill: var(--ink); }
    .flame { fill: var(--accent); }
    .wordmark { font-family: var(--wordmark); font-size: 52px; font-weight: 700; }
  </style>
